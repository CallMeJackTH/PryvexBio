<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pryvex Bio</title>
<link rel="icon" href="https://i.ibb.co/cSkN3GZ7/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;600;800&display=swap" rel="stylesheet">
<style id="css">
:root{--ui-bg:#fff;--ui-fg:#15182b;--ui-mut:#6a7090;--ui-line:#dde0ee;--ui-in:#f2f3fa;--ac:#8b7bff;--ac2:#34e0c4;--r:28px;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ui-bg:#171a2c;--ui-fg:#f2f3fb;--ui-mut:#9aa0bf;--ui-line:#2a2f4a;--ui-in:#20243b}}
:root[data-theme="dark"]{--ui-bg:#171a2c;--ui-fg:#f2f3fb;--ui-mut:#9aa0bf;--ui-line:#2a2f4a;--ui-in:#20243b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:#000;color:#fff;font-family:'Prompt',system-ui,-apple-system,'Segoe UI',sans-serif;overflow-x:hidden;-webkit-font-smoothing:antialiased}
#bg{position:fixed;inset:0;z-index:-1;overflow:hidden;background:#000}
#bgl{position:absolute;left:0;right:0;top:-10%;height:120%;will-change:transform;background-size:cover}
#bg::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 0,transparent,rgba(0,0,0,.35))}
.hero{min-height:78vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:clamp(28px,6vw,64px) 20px 24px;gap:14px}
.brand{display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border-radius:999px;background:rgba(255,255,255,.12);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.2);font-size:13px;font-weight:600;letter-spacing:.04em}
.dot{width:9px;height:9px;border-radius:50%;background:var(--ac2);box-shadow:0 0 0 0 var(--ac2);animation:pulse 1.8s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 9px transparent}100%{box-shadow:0 0 0 0 transparent}}
.ava{width:clamp(96px,16vw,140px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-size:clamp(40px,7vw,60px);font-weight:800;background:linear-gradient(135deg,var(--ac),var(--ac2));border:4px solid rgba(255,255,255,.35);box-shadow:0 20px 50px rgba(0,0,0,.4)}
h1{margin:0;font-size:clamp(34px,8vw,76px);font-weight:800;line-height:1.05;background:linear-gradient(100deg,#fff 30%,var(--ac2) 50%,#fff 70%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shim 4s linear infinite}
@keyframes shim{to{background-position:-250% 0}}
.bio{margin:0;max-width:520px;font-size:clamp(14px,2.2vw,18px);color:rgba(255,255,255,.85);text-shadow:0 2px 12px rgba(0,0,0,.5)}
.hint{margin-top:18px;font-size:13px;opacity:.7;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(6px)}}
.mq{overflow:hidden;white-space:nowrap;border-block:1px solid rgba(255,255,255,.15);background:rgba(0,0,0,.25);backdrop-filter:blur(6px);margin:8px 0 clamp(28px,6vw,60px)}
.mq div{display:inline-block;padding:10px 0;animation:mq 22s linear infinite;font-weight:600;font-size:14px;letter-spacing:.08em}
.mq span{margin:0 22px;opacity:.85}
@keyframes mq{to{transform:translateX(-50%)}}
.stack{display:grid;gap:clamp(28px,6vw,64px);padding:0 clamp(14px,4vw,32px) 90px}
.panel{position:relative;display:block;width:min(100%,920px);height:500px;margin-inline:auto;border-radius:var(--r);overflow:hidden;isolation:isolate;color:#fff;text-decoration:none;box-shadow:0 30px 70px rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.14);transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.panel:hover{transform:translateY(-6px) scale(1.01)}
.pimg{position:absolute;left:0;right:0;top:-18%;height:136%;background-size:cover;background-position:center;will-change:transform;z-index:-3}
.scrim{position:absolute;inset:0;z-index:-2;background:linear-gradient(to top,rgba(0,0,0,.82),rgba(0,0,0,.05) 65%)}
.spot{position:absolute;inset:0;z-index:-1;opacity:0;transition:opacity .3s;background:radial-gradient(380px circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.22),transparent 60%)}
.panel:hover .spot{opacity:1}
.num{position:absolute;top:18px;left:20px;font-size:13px;font-weight:600;padding:4px 12px;border-radius:999px;background:rgba(0,0,0,.4);backdrop-filter:blur(8px)}
.info{position:absolute;left:0;right:0;bottom:0;padding:clamp(18px,3vw,32px);display:flex;justify-content:space-between;align-items:flex-end;gap:16px}
.info h2{margin:0 0 4px;font-size:clamp(22px,4vw,36px);font-weight:800;line-height:1.15}
.info p{margin:0;font-size:clamp(13px,1.8vw,16px);opacity:.85}
.go{flex:none;padding:12px 20px;border-radius:999px;background:#fff;color:#111;font-weight:600;font-size:14px}
.empty{text-align:center;opacity:.8;padding:40px 0}
@media (max-width:1023px){.panel{width:min(100%,720px);height:420px}}
@media (max-width:639px){.panel{height:min(112vw,440px);--r:22px}.info{flex-direction:column;align-items:flex-start}.hero{min-height:70vh}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.pimg,#bgl{transform:none!important}}
/* admin */
.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:30;border:0;padding:14px 20px;border-radius:999px;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#101322;font:600 14px 'Prompt',sans-serif;box-shadow:0 12px 30px rgba(0,0,0,.45);cursor:pointer}
.ov{position:fixed;inset:0;z-index:40;background:rgba(5,7,15,.6);backdrop-filter:blur(3px);display:none}
.ov.on{display:block}
.dr{position:absolute;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--ui-bg);color:var(--ui-fg);display:flex;flex-direction:column;box-shadow:-20px 0 60px rgba(0,0,0,.4)}
@media (max-width:639px){.dr{top:auto;left:0;width:100%;height:90%;border-radius:22px 22px 0 0}}
.dh{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid var(--ui-line);font-weight:800}
.db{flex:1;overflow-y:auto;padding:16px 18px;display:grid;gap:14px;align-content:start}
.df{padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--ui-line);display:flex;gap:10px}
.sec{font-size:12px;font-weight:600;color:var(--ui-mut);letter-spacing:.08em;text-transform:uppercase}
.card{border:1px solid var(--ui-line);border-radius:16px;padding:12px;display:grid;gap:8px;background:var(--ui-in)}
label{display:grid;gap:4px;font-size:12px;color:var(--ui-mut)}
input[type=text]{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--ui-line);background:var(--ui-bg);color:var(--ui-fg);font:14px 'Prompt',sans-serif}
input[type=color]{width:100%;height:38px;border:1px solid var(--ui-line);border-radius:10px;background:var(--ui-bg);padding:2px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1}
.b{border:1px solid var(--ui-line);background:var(--ui-bg);color:var(--ui-fg);padding:9px 12px;border-radius:10px;font:600 13px 'Prompt',sans-serif;cursor:pointer;text-align:center}
.b.p{background:linear-gradient(135deg,var(--ac),var(--ac2));border:0;color:#101322}
.b.d{color:#e5484d}
.toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;z-index:60;background:#111;color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;transition:.3s;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}

.ava{position:relative;overflow:hidden;cursor:pointer;transition:transform .25s}
.ava:hover{transform:scale(1.05)}
.ava img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
input[type=password]{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--ui-line);background:var(--ui-in);color:var(--ui-fg);font:14px 'Prompt',sans-serif}
.lg{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:min(340px,90%);background:var(--ui-bg);color:var(--ui-fg);padding:22px;border-radius:20px;display:grid;gap:12px;box-shadow:0 30px 80px rgba(0,0,0,.5)}
</style>
</head>
<body>
<div id="bg"><div id="bgl"></div></div>
<div id="root"></div>
<div id="adm"></div>
<div class="toast" id="toast"></div>
<script>
const $=id=>document.getElementById(id);
const h=(t,a={},...k)=>{const e=document.createElement(t);for(const x in a){if(x==='class')e.className=a[x];else if(x.slice(0,2)==='on')e.addEventListener(x.slice(2),a[x]);else e.setAttribute(x,a[x])}k.flat().forEach(c=>e.append(c));return e};
let S={name:'JACK_007',bio:'ช่องของ JACK_007 · รวมลิงก์ทั้งหมดไว้ที่เดียว',avatar:'https://i.ibb.co/cSkN3GZ7/favicon.png',bg:{c1:'#0b1020',c2:'#4a1d8f',img:''},links:[{id:'l1',title:'YouTube',url:'https://youtube.com',desc:'ติดตามคลิปใหม่ล่าสุด',img:''}]};
const TK='pvx_t';
const getT=()=>{try{const t=localStorage.getItem(TK)||'';return Number(t.split('.')[0])>Date.now()?t:''}catch(e){return ''}};
const setT=t=>{try{t?localStorage.setItem(TK,t):localStorage.removeItem(TK)}catch(e){}};
const safe=u=>/^(https?:|mailto:|tel:)/i.test(u)?u:'https://'+u;
const imgOk=u=>/^https:\/\/[^\s"')]+$/i.test(u||'');
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),2600)}
async function api(p,o={}){const t=getT();const r=await fetch(p,{...o,headers:{...(o.headers||{}),...(t?{Authorization:'Bearer '+t}:{})}});if(r.status===401&&t)setT('');return r}
const adminOpen=()=>getT()?openEd():openLogin();
function renderSite(){
  const b=S.bg;$('bgl').style.background=imgOk(b.img)?`url("${b.img}") center/cover`:`linear-gradient(160deg,${b.c1},${b.c2})`;
  const r=$('root');r.textContent='';
  const ava=h('div',{class:'ava',role:'button',tabindex:'0',title:'โปรไฟล์',onclick:adminOpen,onkeydown:e=>{if(e.key==='Enter')adminOpen()}},(S.name||'J').trim().charAt(0).toUpperCase());
  if(imgOk(S.avatar)){const im=h('img',{src:S.avatar,alt:'',referrerpolicy:'no-referrer'});im.onerror=()=>im.remove();ava.append(im)}
  r.append(h('section',{class:'hero'},h('div',{class:'brand'},h('span',{class:'dot'}),'Pryvex Bio'),ava,h('h1',{},S.name||'JACK_007'),h('p',{class:'bio'},S.bio||''),h('div',{class:'hint'},'เลื่อนลงเพื่อดูลิงก์ ↓')));
  if(S.links.length){const t=()=>S.links.map(l=>h('span',{},'✦ '+l.title));r.append(h('div',{class:'mq'},h('div',{},t(),t())))}
  const st=h('main',{class:'stack'});
  if(!S.links.length)st.append(h('div',{class:'empty'},'ยังไม่มีลิงก์'));
  S.links.forEach((l,i)=>{
    const hue=(i*67+250)%360;
    const bgc=imgOk(l.img)?`url("${l.img}") center/cover`:`linear-gradient(135deg,hsl(${hue} 70% 45%),hsl(${(hue+60)%360} 70% 25%))`;
    const p=h('a',{class:'panel',href:safe(l.url||'#'),target:'_blank',rel:'noopener noreferrer'},
      h('div',{class:'pimg',style:'background:'+bgc}),h('div',{class:'scrim'}),h('div',{class:'spot'}),
      h('span',{class:'num'},String(i+1).padStart(2,'0')),
      h('div',{class:'info'},h('div',{},h('h2',{},l.title||'ลิงก์'),h('p',{},l.desc||'')),h('span',{class:'go'},'เปิดลิงก์ →')));
    p.addEventListener('pointermove',e=>{const q=p.getBoundingClientRect();p.style.setProperty('--mx',(e.clientX-q.left)+'px');p.style.setProperty('--my',(e.clientY-q.top)+'px')});
    st.append(p);
  });
  r.append(st);tick();
}
let raf=0;
function tick(){cancelAnimationFrame(raf);raf=requestAnimationFrame(()=>{
  const vh=innerHeight;$('bgl').style.transform=`translate3d(0,${-scrollY*.12}px,0)`;
  document.querySelectorAll('.panel').forEach(p=>{const q=p.getBoundingClientRect();if(q.bottom<-100||q.top>vh+100)return;
    p.firstChild.style.transform=`translate3d(0,${(q.top+q.height/2-vh/2)*-.14}px,0)`})})}
addEventListener('scroll',tick,{passive:true});addEventListener('resize',tick);
function shrink(f,m=1600){return new Promise((ok,no)=>{const i=new Image(),u=URL.createObjectURL(f);i.onload=()=>{const k=Math.min(1,m/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);c.getContext('2d').drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>b?ok(b):no(),'image/jpeg',.85)};i.onerror=no;i.src=u})}
async function upload(file,cb){if(!file)return;try{toast('กำลังอัปโหลด…');const b=await shrink(file);const r=await api('/api/upload',{method:'POST',headers:{'Content-Type':'image/jpeg'},body:b});if(!r.ok)throw 0;cb((await r.json()).url);renderSite();openEd();toast('อัปโหลดแล้ว — อย่าลืมกดบันทึก')}catch(e){toast('อัปโหลดไม่สำเร็จ')}}
async function save(){toast('กำลังบันทึก…');try{const r=await api('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(S)});if(r.status===401){openLogin();return}if(!r.ok)throw 0;toast('บันทึกและเผยแพร่แล้ว ✓')}catch(e){toast('บันทึกไม่สำเร็จ')}}
function openLogin(){
  const a=$('adm');a.textContent='';
  const pw=h('input',{type:'password',placeholder:'รหัสผ่านแอดมิน',autocomplete:'current-password'});
  const go=async()=>{try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:pw.value})});if(!r.ok)throw 0;setT((await r.json()).token);openEd();toast('เข้าสู่ระบบแล้ว')}catch(e){toast('รหัสไม่ถูกต้อง');pw.select()}};
  pw.addEventListener('keydown',e=>{if(e.key==='Enter')go()});
  const ov=h('div',{class:'ov on',onclick:e=>{if(e.target===ov)ov.remove()}},h('div',{class:'lg'},h('b',{},'เข้าสู่ระบบแอดมิน'),pw,h('button',{class:'b p',onclick:go},'เข้าสู่ระบบ')));
  a.append(ov);pw.focus();
}
function fld(label,val,fn,type='text'){const i=h('input',{type});i.value=val||'';i.addEventListener('input',()=>{fn(i.value);renderSite()});return h('label',{},label,i)}
function fileBtn(text,cb){const f=h('input',{type:'file',accept:'image/*',style:'display:none'});f.addEventListener('change',()=>upload(f.files[0],cb));return h('button',{class:'b',onclick:()=>f.click()},text,f)}
function openEd(){
  const a=$('adm'),old=a.querySelector('.db'),sc=old?old.scrollTop:0;a.textContent='';
  const ov=h('div',{class:'ov on',onclick:e=>{if(e.target===ov)ov.remove()}});
  const re=()=>{renderSite();openEd()};
  const body=h('div',{class:'db'},
    h('div',{class:'sec'},'โปรไฟล์'),
    fld('ชื่อช่อง',S.name,v=>S.name=v),fld('คำอธิบาย',S.bio,v=>S.bio=v),
    fld('URL รูปโปรไฟล์',S.avatar,v=>S.avatar=v),fileBtn('อัปโหลดรูปโปรไฟล์',u=>S.avatar=u),
    h('div',{class:'sec'},'พื้นหลังเว็บไซต์'),
    h('div',{class:'row'},fld('สีบน',S.bg.c1,v=>S.bg.c1=v,'color'),fld('สีล่าง',S.bg.c2,v=>S.bg.c2=v,'color')),
    h('div',{class:'row'},fileBtn(S.bg.img?'เปลี่ยนรูปพื้นหลัง':'อัปโหลดรูปพื้นหลัง',u=>S.bg.img=u),
      S.bg.img?h('button',{class:'b d',onclick:()=>{S.bg.img='';re()}},'ใช้สีไล่เฉดแทน'):''),
    h('div',{class:'sec'},'ลิงก์ ('+S.links.length+')'));
  S.links.forEach((l,i)=>{
    const mv=d=>()=>{const j=i+d;if(j<0||j>=S.links.length)return;[S.links[i],S.links[j]]=[S.links[j],S.links[i]];re()};
    body.append(h('div',{class:'card'},
      fld('ชื่อลิงก์',l.title,v=>l.title=v),fld('URL',l.url,v=>l.url=v),fld('คำอธิบายสั้น',l.desc,v=>l.desc=v),
      h('div',{class:'row'},fileBtn(l.img?'เปลี่ยนรูปหน้าปก':'อัปโหลดรูปหน้าปก',u=>l.img=u),
        l.img?h('button',{class:'b',onclick:()=>{l.img='';re()}},'ลบรูป'):''),
      h('div',{class:'row'},h('button',{class:'b',onclick:mv(-1)},'▲ ขึ้น'),h('button',{class:'b',onclick:mv(1)},'▼ ลง'),
        h('button',{class:'b d',onclick:()=>{S.links.splice(i,1);re()}},'ลบ'))));
  });
  body.append(h('button',{class:'b',onclick:()=>{S.links.push({id:'l'+Date.now(),title:'ลิงก์ใหม่',url:'https://',desc:'',img:''});re();setTimeout(()=>{const d=$('adm').querySelector('.db');d.scrollTop=d.scrollHeight},30)}},'+ เพิ่มลิงก์'));
  ov.append(h('div',{class:'dr'},
    h('div',{class:'dh'},'แอดมิน · Pryvex Bio',h('div',{class:'row'},h('button',{class:'b',onclick:()=>{setT('');ov.remove();toast('ออกจากระบบแล้ว')}},'ออกจากระบบ'),h('button',{class:'b',onclick:()=>ov.remove()},'ปิด'))),body,
    h('div',{class:'df'},h('button',{class:'b p',onclick:save},'บันทึกและเผยแพร่'))));
  a.append(ov);body.scrollTop=sc;
}
renderSite();
fetch('/api/config').then(r=>r.ok?r.json():null).then(d=>{if(d&&Array.isArray(d.links)){S={...S,...d,bg:{...S.bg,...(d.bg||{})}};renderSite()}}).catch(()=>{});
</script>
</body>
</html>
