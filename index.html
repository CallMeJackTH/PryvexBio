<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Geometry Quiz Game</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
        }

        .background-glow {
            position: absolute;
            width: 300px;
            height: 300px;
            background: #3b82f6;
            filter: blur(150px);
            border-radius: 50%;
            z-index: 0;
            animation: pulse 6s infinite alternate;
        }

        @keyframes pulse {
            0% { transform: scale(1) translate(-50px, -50px); opacity: 0.4; }
            100% { transform: scale(1.3) translate(50px, 50px); opacity: 0.7; }
        }

        .quiz-container {
            position: relative;
            z-index: 1;
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 2.5rem;
            width: 90%;
            max-width: 600px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            animation: slideUp 0.6s ease-out;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .title {
            font-size: 1.2rem;
            font-weight: 700;
            color: #60a5fa;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .score-badge {
            background: rgba(59, 130, 246, 0.2);
            border: 1px solid #3b82f6;
            padding: 0.4rem 1rem;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: bold;
            color: #93c5fd;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            margin-bottom: 2rem;
            overflow: hidden;
        }

        .progress {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #3b82f6, #8b5cf6);
            transition: width 0.4s ease;
        }

        .question {
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            line-height: 1.5;
        }

        .options {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1rem;
        }

        .btn-option {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 1rem 1.2rem;
            border-radius: 12px;
            color: #f8fafc;
            font-size: 1rem;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn-option:hover {
            background: rgba(59, 130, 246, 0.15);
            border-color: #3b82f6;
            transform: translateX(5px);
        }

        .btn-option.correct {
            background: rgba(34, 197, 94, 0.2) !important;
            border-color: #22c55e !important;
            color: #4ade80;
            animation: bounce 0.4s ease;
        }

        .btn-option.wrong {
            background: rgba(239, 68, 68, 0.2) !important;
            border-color: #ef4444 !important;
            color: #fca5a5;
            animation: shake 0.4s ease;
        }

        @keyframes bounce {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px); }
            40%, 80% { transform: translateX(8px); }
        }

        .btn-next {
            margin-top: 2rem;
            width: 100%;
            padding: 1rem;
            border: none;
            border-radius: 12px;
            background: linear-gradient(90deg, #3b82f6, #8b5cf6);
            color: white;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            display: none;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
            transition: transform 0.2s;
        }

        .btn-next:hover {
            transform: translateY(-2px);
        }

        .result-screen {
            text-align: center;
            display: none;
        }

        .result-title {
            font-size: 2rem;
            color: #60a5fa;
            margin-bottom: 1rem;
        }

        .result-score {
            font-size: 3rem;
            font-weight: 800;
            margin-bottom: 1.5rem;
            background: linear-gradient(90deg, #3b82f6, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .btn-restart {
            padding: 0.8rem 2rem;
            border: none;
            border-radius: 12px;
            background: #3b82f6;
            color: white;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="background-glow"></div>

    <div class="quiz-container">
        <!-- Main Quiz Screen -->
        <div id="quiz-screen">
            <div class="header">
                <span class="title">3D Geometry Quiz</span>
                <span class="score-badge" id="score">Score: 0</span>
            </div>
            <div class="progress-bar">
                <div class="progress" id="progress"></div>
            </div>
            <div class="question" id="question-text">Loading question...</div>
            <div class="options" id="options-container"></div>
            <button class="btn-next" id="next-btn" onclick="nextQuestion()">ข้อถัดไป ➔</button>
        </div>

        <!-- End Result Screen -->
        <div class="result-screen" id="result-screen">
            <div class="result-title">🎉 สรุปผลคะแนน!</div>
            <div class="result-score" id="final-score">0 / 0</div>
            <p id="result-comment" style="margin-bottom: 2rem; color: #94a3b8;"></p>
            <button class="btn-restart" onclick="restartQuiz()">เล่นใหม่อีกครั้ง</button>
        </div>
    </div>

    <script>
        const questions = [
            {
                question: "ปริมาตรของ 'พีระมิด' มีสูตรคำนวณอย่างไร?",
                options: [
                    "1/3 × พื้นที่ฐาน × สูงตรง",
                    "พื้นที่ฐาน × สูงตรง",
                    "1/2 × ความยาวรอบฐาน × สูงเอียง",
                    "4/3 × π × r³"
                ],
                answer: 0
            },
            {
                question: "พื้นที่ผิวข้างของ 'ทรงกรวย' ใช้สูตรใด?",
                options: [
                    "2πrh",
                    "πrl (ไปร์-เอล)",
                    "4πr²",
                    "1/2 × รอบฐาน × สูงเอียง"
                ],
                answer: 1
            },
            {
                question: "สูตรปริมาตรของ 'ทรงกลม' คือข้อใด?",
                options: [
                    "4πr²",
                    "πr²h",
                    "4/3 πr³",
                    "1/3 πr²h"
                ],
                answer: 2
            },
            {
                question: "ทรงกระบอกและพีระมิดที่มีฐานและสูงเท่ากัน ปริมาตรพีระมิดจะเป็นกี่ส่วนของทรงกระบอก?",
                options: [
                    "1 ใน 2 ส่วน",
                    "1 ใน 3 ส่วน",
                    "1 ใน 4 ส่วน",
                    "เท่ากันพอดี"
                ],
                answer: 1
            },
            {
                question: "หากต้องการหา 'สูงเอียง' ของพีระมิด ต้องใช้อุปกรณ์/ทฤษฎีบทใดช่วย?",
                options: [
                    "ทฤษฎีบทพีทาโกรัส",
                    "สูตรวงกลม πr²",
                    "ตรีโกณมิติ sin cos tan",
                    "การใช้อัตราส่วนคงที่"
                ],
                answer: 0
            }
        ];

        let currentQuestionIndex = 0;
        let score = 0;
        let canAnswer = true;

        const questionEl = document.getElementById('question-text');
        const optionsEl = document.getElementById('options-container');
        const scoreEl = document.getElementById('score');
        const progressEl = document.getElementById('progress');
        const nextBtn = document.getElementById('next-btn');

        function loadQuestion() {
            canAnswer = true;
            nextBtn.style.display = 'none';
            const q = questions[currentQuestionIndex];
            
            questionEl.innerText = `${currentQuestionIndex + 1}. ${q.question}`;
            optionsEl.innerHTML = '';

            // Update Progress Bar
            progressEl.style.width = `${((currentQuestionIndex) / questions.length) * 100}%`;

            q.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.classList.add('btn-option');
                btn.innerText = opt;
                btn.onclick = () => selectOption(idx, btn);
                optionsEl.appendChild(btn);
            });
        }

        function selectOption(selectedIndex, button) {
            if (!canAnswer) return;
            canAnswer = false;

            const correctIndex = questions[currentQuestionIndex].answer;
            const buttons = optionsEl.children;

            if (selectedIndex === correctIndex) {
                button.classList.add('correct');
                score++;
                scoreEl.innerText = `Score: ${score}`;
            } else {
                button.classList.add('wrong');
                buttons[correctIndex].classList.add('correct');
            }

            nextBtn.style.display = 'block';
        }

        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < questions.length) {
                loadQuestion();
            } else {
                showResults();
            }
        }

        function showResults() {
            document.getElementById('quiz-screen').style.display = 'none';
            document.getElementById('result-screen').style.display = 'block';
            
            document.getElementById('final-score').innerText = `${score} / ${questions.length}`;
            
            const comment = document.getElementById('result-comment');
            if (score === questions.length) {
                comment.innerText = "🏆 สุโค่ย! จำสูตรได้แม่นยำ 100% พร้อมสอบสุดๆ!";
            } else if (score >= 3) {
                comment.innerText = "👍 เก่งมาก! ทบทวนอีกนิดเดียวก็เต็มแล้ว";
            } else {
                comment.innerText = "💪 ไม่เป็นไรนะ ลองทบทวนสูตรในตาราง แล้วมาเล่นใหม่อีกรอบ!";
            }
        }

        function restartQuiz() {
            currentQuestionIndex = 0;
            score = 0;
            scoreEl.innerText = `Score: 0`;
            document.getElementById('result-screen').style.display = 'none';
            document.getElementById('quiz-screen').style.display = 'block';
            loadQuestion();
        }

        // Start Quiz
        loadQuestion();
    </script>
</body>
</html>
