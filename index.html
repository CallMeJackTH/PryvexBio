
<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080b16">
<title>Pryvex Bio</title>
<link rel="icon" href="https://i.ibb.co/cSkN3GZ7/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root {
  --bg:#080b16;
  --fg:#fff;
  --mut:#a2a8c3;
  --line:rgba(255,255,255,.14);
  --ac:#8b7bff;
  --ac2:#34e0c4;
  --panel:#171a2c;
  --input:#20243b;
  --r:26px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;background:#000;color:var(--fg);
  font-family:'Prompt',sans-serif;overflow-x:hidden;
  -webkit-font-smoothing:antialiased
}
button,input{font-family:inherit}
button{cursor:pointer}
#bg{position:fixed;inset:0;z-index:-2;background:#000;overflow:hidden}
#bgl{position:absolute;inset:-10% 0;background:linear-gradient(160deg,#0b1020,#4a1d8f);will-change:transform}
#bg:after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at top,transparent,rgba(0,0,0,.45))}
.hero{
  min-height:76vh;display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;
  padding:90px 20px 30px;gap:14px
}
.brand{
  display:inline-flex;align-items:center;gap:8px;padding:6px 14px;
  border-radius:999px;background:rgba(255,255,255,.1);
  border:1px solid var(--line);font-size:13px;font-weight:600
}
.dot{width:9px;height:9px;border-radius:50%;background:var(--ac2);box-shadow:0 0 12px var(--ac2)}
.ava{
  position:relative;overflow:hidden;width:clamp(96px,16vw,140px);
  aspect-ratio:1;border-radius:50%;display:grid;place-items:center;
  font-size:54px;font-weight:800;background:linear-gradient(135deg,var(--ac),var(--ac2));
  border:4px solid rgba(255,255,255,.35);box-shadow:0 20px 50px #0007
}
.ava img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
h1{
  margin:0;font-size:clamp(34px,8vw,76px);font-weight:800;line-height:1.1;
  background:linear-gradient(100deg,#fff 30%,var(--ac2),#fff 70%);
  -webkit-background-clip:text;background-clip:text;color:transparent
}
.bio{margin:0;max-width:520px;color:#ffffffd9;font-size:clamp(14px,2.2vw,18px)}
.hint{margin-top:15px;font-size:13px;opacity:.7}
.mq{
  overflow:hidden;white-space:nowrap;border-block:1px solid var(--line);
  background:#0005;margin:8px 0 50px
}
.mq div{display:inline-block;padding:10px 0;animation:marquee 24s linear infinite;font-size:14px}
.mq span{margin:0 22px}
@keyframes marquee{to{transform:translateX(-50%)}}
.stack{display:grid;gap:clamp(28px,6vw,64px);padding:0 16px 90px}
.panel{
  position:relative;display:block;width:min(100%,920px);height:500px;
  margin:auto;border-radius:var(--r);overflow:hidden;isolation:isolate;
  color:#fff;text-decoration:none;border:1px solid var(--line);
  box-shadow:0 30px 70px #0007;transition:transform .25s
}
.panel:hover{transform:translateY(-5px)}
.pimg{position:absolute;inset:-18% 0;height:136%;background-size:cover;background-position:center;z-index:-3}
.scrim{position:absolute;inset:0;z-index:-2;background:linear-gradient(to top,#000d,transparent 70%)}
.num{position:absolute;top:18px;left:20px;padding:4px 12px;border-radius:999px;background:#0007;font-size:13px}
.info{position:absolute;left:0;right:0;bottom:0;padding:28px;display:flex;justify-content:space-between;align-items:flex-end;gap:16px}
.info h2{margin:0 0 4px;font-size:clamp(22px,4vw,36px);line-height:1.2}
.info p{margin:0;font-size:14px;opacity:.8}
.go{padding:12px 20px;border-radius:999px;background:white;color:#111;font-weight:600;font-size:14px;white-space:nowrap}
.empty{text-align:center;opacity:.8;padding:40px}
@media(max-width:639px){
  .hero{min-height:70vh}
  .panel{height:min(112vw,440px);--r:22px}
  .info{flex-direction:column;align-items:flex-start;padding:20px}
}

/* ปุ่มโดเนทด้านขวาบน */
.top-actions{
  position:fixed;top:calc(14px + env(safe-area-inset-top,0px));
  right:calc(14px + env(safe-area-inset-right,0px));
  z-index:35;display:flex;gap:8px;align-items:center
}
.donate-trigger{
  display:flex;align-items:center;gap:8px;border:1px solid #ffffff45;
  border-radius:999px;padding:11px 17px;
  color:#101322;font-size:13px;font-weight:700;
  background:linear-gradient(135deg,var(--ac),var(--ac2));
  box-shadow:0 8px 28px #0006;transition:transform .2s
}
.donate-trigger:hover{transform:translateY(-2px)}
.donate-heart{font-size:17px}

/* หน้าต่างโดเนท */
.modal-overlay{
  position:fixed;inset:0;z-index:100;background:#050713c9;
  backdrop-filter:blur(10px);display:none;align-items:center;
  justify-content:center;padding:18px
}
.modal-overlay.show{display:flex}
.donate-modal{
  position:relative;width:min(100%,420px);border-radius:26px;
  padding:30px 23px 24px;text-align:center;overflow:hidden;
  color:#fff;background:linear-gradient(155deg,#1b2040,#101321 75%);
  border:1px solid #ffffff24;box-shadow:0 30px 100px #0009;
  animation:pop .2s ease-out
}
@keyframes pop{from{opacity:0;transform:translateY(12px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
.donate-modal:before{
  content:"";position:absolute;top:-100px;left:50%;transform:translateX(-50%);
  width:250px;height:200px;background:#8b7bff55;filter:blur(60px);pointer-events:none
}
.close-modal{
  position:absolute;right:13px;top:13px;width:36px;height:36px;
  border-radius:50%;border:1px solid #ffffff25;background:#ffffff0c;
  color:#fff;font-size:20px
}
.donate-icon{
  position:relative;display:grid;place-items:center;margin:8px auto 18px;
  width:76px;height:76px;border-radius:24px;
  background:linear-gradient(135deg,var(--ac),var(--ac2));
  color:#101322;font-size:34px;box-shadow:0 12px 35px #8b7bff35
}
.donate-modal h2{position:relative;margin:0 0 10px;font-size:27px;font-weight:800}
.donate-modal p{position:relative;color:#bfc5df;font-size:14px;line-height:1.8;margin:0 0 22px}
.donate-primary{
  position:relative;display:flex;align-items:center;justify-content:center;gap:8px;
  width:100%;padding:14px;border:0;border-radius:14px;
  background:linear-gradient(135deg,var(--ac),var(--ac2));
  color:#101322;font-size:15px;font-weight:800;text-decoration:none
}
.donate-secondary{
  position:relative;margin-top:10px;width:100%;padding:12px;
  border:1px solid #ffffff20;border-radius:14px;background:#ffffff08;
  color:#fff;font-size:13px
}
.donate-note{position:relative;margin-top:16px!important;margin-bottom:0!important;font-size:11px!important;opacity:.7}

/* แอดมิน */
.fab{
  position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));
  z-index:30;border:0;padding:13px 19px;border-radius:999px;
  background:linear-gradient(135deg,var(--ac),var(--ac2));color:#101322;
  font-size:13px;font-weight:700;box-shadow:0 12px 30px #0007
}
.ov{position:fixed;inset:0;z-index:40;background:#05070fcc;backdrop-filter:blur(5px);display:none}
.ov.on{display:block}
.dr{
  position:absolute;top:0;right:0;bottom:0;width:min(440px,100%);
  background:#171a2c;color:#f2f3fb;display:flex;flex-direction:column;
  box-shadow:-20px 0 60px #0007
}
@media(max-width:639px){.dr{top:auto;left:0;width:100%;height:92%;border-radius:22px 22px 0 0}}
.dh{display:flex;justify-content:space-between;align-items:center;padding:15px;border-bottom:1px solid #ffffff18;font-weight:800;gap:8px}
.db{flex:1;overflow-y:auto;padding:16px;display:grid;gap:13px;align-content:start}
.df{padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid #ffffff18}
.sec{font-size:12px;font-weight:700;color:#a2a8c3;letter-spacing:.07em}
.card{border:1px solid #ffffff20;border-radius:16px;padding:12px;display:grid;gap:9px;background:#ffffff05}
label{display:grid;gap:4px;font-size:12px;color:#a2a8c3}
input[type=text],input[type=password]{
  width:100%;padding:10px 12px;border-radius:10px;border:1px solid #ffffff25;
  background:#20243b;color:#fff;font-size:14px
}
input[type=color]{width:100%;height:38px;border:1px solid #ffffff25;border-radius:10px;background:#20243b;padding:2px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1;min-width:0}
.b{border:1px solid #ffffff25;background:#20243b;color:#fff;padding:9px 11px;border-radius:10px;font-size:12px;font-weight:600}
.b.p{background:linear-gradient(135deg,var(--ac),var(--ac2));border:0;color:#101322}
.b.d{color:#ff777e}
.toast{
  position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom,0px));
  transform:translate(-50%,20px);opacity:0;z-index:120;background:#171a2c;
  border:1px solid #ffffff20;color:#fff;padding:10px 16px;border-radius:999px;
  font-size:12px;transition:.2s;pointer-events:none;max-width:90%;text-align:center
}
.toast.on{opacity:1;transform:translate(-50%,0)}
.lg{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  width:min(340px,90%);background:#171a2c;color:#fff;padding:22px;
  border-radius:20px;display:grid;gap:12px
}
.dstat{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.dstat>div{border:1px solid #ffffff20;border-radius:12px;padding:12px;background:#20243b}
.dstat strong{display:block;font-size:20px}
.dlist{display:grid;gap:8px}
.donrow{padding:10px;border:1px solid #ffffff20;border-radius:12px;background:#20243b;font-size:13px;overflow-wrap:anywhere}
.muted{color:#a2a8c3;font-size:12px}
</style>
</head>

<body>
<div id="bg"><div id="bgl"></div></div>

<div class="top-actions">
  <button class="donate-trigger" id="donateOpen" type="button">
    <span class="donate-heart">♥</span> โดเนท
  </button>
</div>

<div id="root"></div>
<div id="adm"></div>
<div class="toast" id="toast" role="status"></div>

<!-- หน้าต่างโดเนท -->
<div class="modal-overlay" id="donateOverlay" aria-hidden="true">
  <section class="donate-modal" role="dialog" aria-modal="true" aria-labelledby="donateTitle">
    <button class="close-modal" id="donateClose" type="button" aria-label="ปิด">×</button>
    <div class="donate-icon">♥</div>
    <h2 id="donateTitle">สนับสนุน Pryvex</h2>
    <p>ขอบคุณที่เข้ามาเยี่ยมชมเว็บไซต์ของเรา<br>หากชื่นชอบผลงาน สามารถสนับสนุนได้ที่นี่</p>
    <a class="donate-primary" id="donateLink" href="https://easydonate.app/" target="_blank" rel="noopener noreferrer">
      ♥ สนับสนุนผ่าน EasyDonate ↗
    </a>
    <button class="donate-secondary" id="donateDismiss" type="button">ไว้ทีหลัง</button>
    <p class="donate-note">การบริจาคจะดำเนินการบนเว็บไซต์ EasyDonate</p>
  </section>
</div>

<script>
/* ใส่ URL หน้าโดเนทจริงของคุณตรงนี้ */
const DONATE_URL = "https://ezdn.app/phuphakub";

const $ = id => document.getElementById(id);
const h = (tag, attrs={}, ...children) => {
  const el = document.createElement(tag);
  for (const key in attrs) {
    if (key === "class") el.className = attrs[key];
    else if (key.startsWith("on")) el.addEventListener(key.slice(2), attrs[key]);
    else el.setAttribute(key, attrs[key]);
  }
  children.flat().forEach(child => {
    if (child instanceof Node) el.append(child);
    else if (child !== null && child !== undefined) el.append(document.createTextNode(String(child)));
  });
  return el;
};

let S = {
  name:"JACK_007",
  bio:"ช่องของ JACK_007 · รวมลิงก์ทั้งหมดไว้ที่เดียว",
  avatar:"https://i.ibb.co/cSkN3GZ7/favicon.png",
  bg:{c1:"#0b1020",c2:"#4a1d8f",img:""},
  links:[{
    id:"l1",title:"YouTube",url:"https://youtube.com",
    desc:"ติดตามคลิปใหม่ล่าสุด",img:""
  }]
};

const TK = "pvx_t";
const getT = () => {
  try {
    const token = localStorage.getItem(TK) || "";
    return Number(token.split(".")[0]) > Date.now() ? token : "";
  } catch { return ""; }
};
const setT = token => {
  try {
    token ? localStorage.setItem(TK,token) : localStorage.removeItem(TK);
  } catch {}
};
const safe = url => /^(https?:|mailto:|tel:)/i.test(url) ? url : "https://" + url;
const imgOk = url => /^https:\/\/[^\s"')]+$/i.test(url || "");

function toast(message) {
  const el = $("toast");
  el.textContent = message;
  el.classList.add("on");
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => el.classList.remove("on"),3000);
}

async function api(path,options={}) {
  const token = getT();
  const response = await fetch(path,{
    ...options,
    headers:{
      ...(options.headers || {}),
      ...(token ? {Authorization:"Bearer " + token} : {})
    }
  });
  if (response.status === 401 && token) setT("");
  return response;
}

/* ปุ่มและหน้าต่างโดเนท */
function openDonate() {
  const overlay = $("donateOverlay");
  overlay.classList.add("show");
  overlay.setAttribute("aria-hidden","false");
  $("donateClose").focus();
}
function closeDonate() {
  $("donateOverlay").classList.remove("show");
  $("donateOverlay").setAttribute("aria-hidden","true");
  $("donateOpen").focus();
}

$("donateOpen").addEventListener("click",openDonate);
$("donateClose").addEventListener("click",closeDonate);
$("donateDismiss").addEventListener("click",closeDonate);
$("donateOverlay").addEventListener("click",event => {
  if (event.target === $("donateOverlay")) closeDonate();
});
document.addEventListener("keydown",event => {
  if (event.key === "Escape" && $("donateOverlay").classList.contains("show")) closeDonate();
});
$("donateLink").addEventListener("click",event => {
  const url = DONATE_URL.trim();
  if (!url || url === "ใส่ลิงก์โดเนทของคุณ") {
    event.preventDefault();
    toast("กรุณาใส่ลิงก์ EasyDonate จริงในตัวแปร DONATE_URL ก่อน");
    return;
  }
  try {
    const parsed = new URL(url);
    if (parsed.protocol !== "https:") throw new Error("Invalid URL");
    $("donateLink").href = parsed.href;
  } catch {
    event.preventDefault();
    toast("ลิงก์โดเนทไม่ถูกต้อง กรุณาตรวจสอบ URL");
  }
});

/* เว็บไซต์หลัก */
function renderSite() {
  const bg = S.bg || {};
  $("bgl").style.background = imgOk(bg.img)
    ? `url("${bg.img}") center/cover`
    : `linear-gradient(160deg,${bg.c1 || "#0b1020"},${bg.c2 || "#4a1d8f"})`;

  const root = $("root");
  root.replaceChildren();

  const avatar = h("div",{
    class:"ava",role:"button",tabindex:"0",title:"โปรไฟล์",
    onclick:adminOpen,
    onkeydown:event => {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        adminOpen();
      }
    }
  },(S.name || "J").trim().charAt(0).toUpperCase());

  if (imgOk(S.avatar)) {
    const image = h("img",{src:S.avatar,alt:"",referrerpolicy:"no-referrer"});
    image.onerror = () => image.remove();
    avatar.append(image);
  }

  root.append(h("section",{class:"hero"},
    h("div",{class:"brand"},h("span",{class:"dot"}),"Pryvex Bio"),
    avatar,
    h("h1",{},S.name || "JACK_007"),
    h("p",{class:"bio"},S.bio || ""),
    h("div",{class:"hint"},"เลื่อนลงเพื่อดูลิงก์ ↓")
  ));

  if (S.links.length) {
    const labels = () => S.links.map(link => h("span",{},"✦ " + link.title));
    root.append(h("div",{class:"mq"},h("div",{},labels(),labels())));
  }

  const stack = h("main",{class:"stack"});
  if (!S.links.length) stack.append(h("div",{class:"empty"},"ยังไม่มีลิงก์"));

  S.links.forEach((link,index) => {
    const hue = (index * 67 + 250) % 360;
    const background = imgOk(link.img)
      ? `url("${link.img}") center/cover`
      : `linear-gradient(135deg,hsl(${hue} 70% 45%),hsl(${(hue+60)%360} 70% 25%))`;

    const panel = h("a",{
      class:"panel",
      href:safe(link.url || "#"),
      target:"_blank",
      rel:"noopener noreferrer"
    },
      h("div",{class:"pimg",style:"background:"+background}),
      h("div",{class:"scrim"}),
      h("span",{class:"num"},String(index+1).padStart(2,"0")),
      h("div",{class:"info"},
        h("div",{},
          h("h2",{},link.title || "ลิงก์"),
          h("p",{},link.desc || "")
        ),
        h("span",{class:"go"},"เปิดลิงก์ →")
      )
    );
    stack.append(panel);
  });

  root.append(stack);
  tick();
}

let raf = 0;
function tick() {
  cancelAnimationFrame(raf);
  raf = requestAnimationFrame(() => {
    $("bgl").style.transform = `translate3d(0,${-scrollY*.12}px,0)`;
    document.querySelectorAll(".panel .pimg").forEach(image => {
      const panel = image.parentElement;
      const rect = panel.getBoundingClientRect();
      if (rect.bottom < -100 || rect.top > innerHeight + 100) return;
      image.style.transform =
        `translate3d(0,${(rect.top+rect.height/2-innerHeight/2)*-.14}px,0)`;
    });
  });
}
addEventListener("scroll",tick,{passive:true});
addEventListener("resize",tick);

function adminOpen() {
  getT() ? openEd() : openLogin();
}

async function upload(file,callback) {
  if (!file) return;
  try {
    toast("กำลังอัปโหลด…");
    const image = new Image();
    const objectURL = URL.createObjectURL(file);
    await new Promise((resolve,reject) => {
      image.onload = resolve;
      image.onerror = reject;
      image.src = objectURL;
    });

    const scale = Math.min(1,1600/Math.max(image.width,image.height));
    const canvas = document.createElement("canvas");
    canvas.width = Math.round(image.width*scale);
    canvas.height = Math.round(image.height*scale);
    canvas.getContext("2d").drawImage(image,0,0,canvas.width,canvas.height);
    URL.revokeObjectURL(objectURL);

    const blob = await new Promise(resolve => canvas.toBlob(resolve,"image/jpeg",.85));
    if (!blob) throw new Error("แปลงรูปไม่สำเร็จ");

    const response = await api("/api/upload",{
      method:"POST",
      headers:{"Content-Type":"image/jpeg"},
      body:blob
    });
    if (!response.ok) throw new Error("อัปโหลดไม่สำเร็จ");
    const result = await response.json();
    callback(result.url);
    renderSite();
    openEd();
    toast("อัปโหลดแล้ว — อย่าลืมกดบันทึก");
  } catch {
    toast("อัปโหลดไม่สำเร็จ ตรวจสอบ Backend");
  }
}

function fileBtn(text,callback) {
  const input = h("input",{type:"file",accept:"image/*",style:"display:none"});
  input.addEventListener("change",() => upload(input.files[0],callback));
  return h("button",{class:"b",onclick:() => input.click()},text,input);
}

function fld(label,value,callback,type="text") {
  const input = h("input",{type});
  input.value = value || "";
  input.addEventListener("input",() => {
    callback(input.value);
    renderSite();
  });
  return h("label",{},label,input);
}

async function save() {
  toast("กำลังบันทึก…");
  try {
    const response = await api("/api/config",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify(S)
    });
    if (response.status === 401) {
      openLogin();
      return;
    }
    if (!response.ok) throw new Error("บันทึกไม่สำเร็จ");
    toast("บันทึกและเผยแพร่แล้ว ✓");
  } catch {
    toast("บันทึกไม่สำเร็จ ตรวจสอบ Backend");
  }
}

function openLogin() {
  const admin = $("adm");
  admin.replaceChildren();

  const password = h("input",{
    type:"password",
    placeholder:"รหัสผ่านแอดมิน",
    autocomplete:"current-password"
  });

  const login = async () => {
    try {
      const response = await fetch("/api/login",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({password:password.value})
      });
      if (!response.ok) throw new Error();
      const data = await response.json();
      if (!data.token) throw new Error();
      setT(data.token);
      openEd();
      toast("เข้าสู่ระบบแล้ว");
    } catch {
      toast("เข้าสู่ระบบไม่สำเร็จ ตรวจสอบรหัสผ่าน");
      password.select();
    }
  };

  password.addEventListener("keydown",event => {
    if (event.key === "Enter") login();
  });

  const overlay = h("div",{class:"ov on",onclick:event => {
    if (event.target === overlay) overlay.remove();
  }},
    h("div",{class:"lg"},
      h("b",{},"เข้าสู่ระบบแอดมิน"),
      password,
      h("button",{class:"b p",onclick:login},"เข้าสู่ระบบ")
    )
  );

  admin.append(overlay);
  password.focus();
}

/* โหลดประวัติโดเนทจาก Backend ของเว็บไซต์ */
async function loadEasyDonate() {
  const status = $("ed-status");
  const list = $("ed-list");
  const total = $("ed-total");
  const count = $("ed-count");

  status.textContent = "กำลังโหลดข้อมูล…";
  list.replaceChildren();
  total.textContent = "—";
  count.textContent = "—";

  try {
    let token = sessionStorage.getItem("pvx_ed_view_token") || "";

    if (!token) {
      token = prompt("ใส่รหัสดูประวัติโดเนทที่ตั้งไว้ใน Vercel (PRYVEX_DONATE_ADMIN_TOKEN)");
      if (!token) {
        status.textContent = "ยกเลิกการโหลด";
        return;
      }
      sessionStorage.setItem("pvx_ed_view_token",token);
    }

    const response = await fetch("/api/easydonate",{
      headers:{Authorization:"Bearer " + token},
      cache:"no-store"
    });

    const data = await response.json().catch(() => ({}));

    if (response.status === 401) {
      sessionStorage.removeItem("pvx_ed_view_token");
      throw new Error("รหัสดูประวัติโดเนทไม่ถูกต้อง");
    }

    if (!response.ok) {
      const reason = data.detail || data.error || "เรียก API ไม่สำเร็จ";
      const upstream = data.upstreamStatus
        ? ` (EasyDonate HTTP ${data.upstreamStatus})`
        : "";
      throw new Error(reason + upstream);
    }

    const payload = data.data || data;
    const rows = Array.isArray(payload)
      ? payload
      : payload.donations || payload.items || payload.results || [];

    if (!Array.isArray(rows)) {
      throw new Error("รูปแบบข้อมูลจาก API ไม่ถูกต้อง");
    }

    const format = number =>
      Number(number || 0).toLocaleString("th-TH",{maximumFractionDigits:2});

    const sum = rows.reduce((result,item) =>
      result + Number(item.amount || item.totalAmount || 0),0);

    total.textContent = format(sum) + " ฿";
    count.textContent = format(rows.length);

    if (!rows.length) {
      list.append(h("div",{class:"muted"},
        "เชื่อมต่อสำเร็จ แต่ไม่พบรายการ หรือรูปแบบข้อมูลยังไม่ตรงกับหน้าเว็บ"));
    }

    rows.slice(0,20).forEach(item => {
      const name = item.donatorName || item.donorName || item.name || "ผู้โดเนท";
      const amount = Number(item.amount || item.totalAmount || 0);
      const when = item.time || item.createdAt || item.created_at || item.date || "";
      const message = item.donateMessage || item.message || "";

      list.append(h("div",{class:"donrow"},
        h("div",{},
          h("b",{},String(name)),
          h("span",{style:"float:right;font-weight:800"},format(amount)+" ฿")
        ),
        when ? h("div",{class:"muted"},
          Number.isNaN(Date.parse(when)) ? String(when) :
          new Date(when).toLocaleString("th-TH")
        ) : "",
        message ? h("div",{},String(message)) : ""
      ));
    });

    status.textContent = "โหลดสำเร็จ · แสดงสูงสุด 20 รายการล่าสุด";
  } catch (error) {
    status.textContent = "โหลดไม่สำเร็จ: " + (error.message || "โปรดลองอีกครั้ง");
  }
}

/* แผงควบคุมแอดมิน */
function openEd() {
  const admin = $("adm");
  const previousBody = admin.querySelector(".db");
  const previousScroll = previousBody ? previousBody.scrollTop : 0;
  admin.replaceChildren();

  const overlay = h("div",{
    class:"ov on",
    onclick:event => {
      if (event.target === overlay) overlay.remove();
    }
  });

  const refresh = () => {
    renderSite();
    openEd();
  };

  const body = h("div",{class:"db"},
    h("div",{class:"sec"},"โปรไฟล์"),
    fld("ชื่อช่อง",S.name,value => S.name=value),
    fld("คำอธิบาย",S.bio,value => S.bio=value),
    fld("URL รูปโปรไฟล์",S.avatar,value => S.avatar=value),
    fileBtn("อัปโหลดรูปโปรไฟล์",url => S.avatar=url),

    h("div",{class:"sec"},"พื้นหลังเว็บไซต์"),
    h("div",{class:"row"},
      fld("สีบน",S.bg.c1,value => S.bg.c1=value,"color"),
      fld("สีล่าง",S.bg.c2,value => S.bg.c2=value,"color")
    ),
    h("div",{class:"row"},
      fileBtn("อัปโหลดรูปพื้นหลัง",url => S.bg.img=url),
      h("button",{class:"b",onclick:() => {S.bg.img="";refresh();}},"ใช้สีไล่เฉดแทน")
    ),
    h("div",{class:"sec"},"ลิงก์ ("+S.links.length+")")
  );

  S.links.forEach((link,index) => {
    const move = direction => {
      const target = index + direction;
      if (target < 0 || target >= S.links.length) return;
      [S.links[index],S.links[target]] = [S.links[target],S.links[index]];
      refresh();
    };

    body.append(h("div",{class:"card"},
      fld("ชื่อลิงก์",link.title,value => link.title=value),
      fld("URL",link.url,value => link.url=value),
      fld("คำอธิบายสั้น",link.desc,value => link.desc=value),
      h("div",{class:"row"},
        fileBtn("เปลี่ยนรูปหน้าปก",url => link.img=url),
        h("button",{class:"b",onclick:() => {link.img="";refresh();}},"ลบรูป")
      ),
      h("div",{class:"row"},
        h("button",{class:"b",onclick:() => move(-1)},"▲ ขึ้น"),
        h("button",{class:"b",onclick:() => move(1)},"▼ ลง"),
        h("button",{class:"b d",onclick:() => {S.links.splice(index,1);refresh();}},"ลบ")
      )
    ));
  });

  body.append(h("button",{class:"b",onclick:() => {
    S.links.push({
      id:"l"+Date.now(),title:"ลิงก์ใหม่",
      url:"https://",desc:"",img:""
    });
    refresh();
    setTimeout(() => {
      const db = admin.querySelector(".db");
      if (db) db.scrollTop = db.scrollHeight;
    },30);
  }},"+ เพิ่มลิงก์"));

  body.append(h("div",{class:"sec"},"EasyDonate · ประวัติโดเนท"));

  body.append(h("div",{class:"card"},
    h("div",{class:"muted"},"API Key เก็บไว้ฝั่ง Vercel เท่านั้น"),
    h("div",{class:"dstat"},
      h("div",{},
        h("span",{class:"muted"},"ยอดรวมที่โหลดได้"),
        h("strong",{id:"ed-total"},"—")
      ),
      h("div",{},
        h("span",{class:"muted"},"จำนวนรายการ"),
        h("strong",{id:"ed-count"},"—")
      )
    ),
    h("div",{id:"ed-status",class:"muted"},"กดโหลดเพื่ออ่านข้อมูลล่าสุด"),
    h("div",{id:"ed-list",class:"dlist"}),
    h("button",{class:"b p",onclick:loadEasyDonate},"โหลดประวัติโดเนท")
  ));

  overlay.append(h("div",{class:"dr"},
    h("div",{class:"dh"},
      "แอดมิน · Pryvex Bio",
      h("div",{class:"row"},
        h("button",{class:"b",onclick:() => {
          setT("");
          sessionStorage.removeItem("pvx_ed_view_token");
          overlay.remove();
          toast("ออกจากระบบแล้ว");
        }},"ออกจากระบบ"),
        h("button",{class:"b",onclick:() => overlay.remove()},"ปิด")
      )
    ),
    body,
    h("div",{class:"df"},
      h("button",{class:"b p",style:"width:100%",onclick:save},"บันทึกและเผยแพร่")
    )
  ));

  admin.append(overlay);
  body.scrollTop = previousScroll;
}

/* เริ่มเว็บไซต์และโหลดค่าที่บันทึกไว้ */
renderSite();

fetch("/api/config",{cache:"no-store"})
  .then(response => response.ok ? response.json() : null)
  .then(data => {
    if (data && Array.isArray(data.links)) {
      S = {
        ...S,
        ...data,
        bg:{...S.bg,...(data.bg || {})}
      };
      renderSite();
    }
  })
  .catch(() => {});
</script>
